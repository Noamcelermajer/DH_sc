name: Cloud reconstruction checks
on:
  push:
    branches: ['reconstruction/cloud-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev
      - name: Configure maintained owners and cloud fixtures
        run: cmake -S port/cloud -B build/cloud -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDH2_CLOUD_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build selected checks
        run: cmake --build build/cloud --target dh2_cloud_check_binaries -j 4
      - name: Replay source and ownership checks
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/cloud --output-on-failure
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloud-checks-${{ matrix.sanitizers }}
          path: |
            build/cloud/Testing/Temporary/
            build/cloud/fixtures/loader-replay.json
